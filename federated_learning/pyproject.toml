[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flex-med"
version = "1.0.0"
description = "Federated Learning for Medical Image Classification with FedMD"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.23.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.3.0"  # For train_test_split if needed
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "shrenik"

[tool.flwr.app.components]
serverapp = "flex_med.server_app:app"
clientapp = "flex_med.client_app:app"

[tool.flwr.app.config]
# Training configuration
num-server-rounds = 20           # 20 rounds of federated learning
fraction-train = 1.0             # Use all clients each round
local-epochs = 10                 # 10 epochs of private training per round
lr = 0.0005                      # Learning rate (conservative for stability)

# Distillation configuration (optional - can add to client_app.py)
distill-lr = 0.001               # Learning rate for distillation
distill-epochs = 1               # Epochs for distillation phase
temperature = 2.0                # Temperature for knowledge distillation

# Data configuration
batch-size = 64                  # Batch size for training/evaluation

[tool.flwr.federations]
default = "local-simulation"

# Local simulation with 3 clients (2 with data + 1 free rider)
[tool.flwr.federations.local-simulation]
options.num-supernodes = 3       # Hospital_CNMC, Hospital_ALLIDB2, Free_Rider

# Optional: Add more clients for scaling experiments
# [tool.flwr.federations.local-simulation-5clients]
# options.num-supernodes = 5

# Remote federation (for deployment)
[tool.flwr.federations.remote-federation]
address = "<SUPERLINK-ADDRESS>:<PORT>"
insecure = true
# root-certificates = "<PATH/TO/ca.crt>"  # For production TLS