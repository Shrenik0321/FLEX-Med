[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flex-med"
version = "1.0.0"
description = "Federated Learning for Medical Image Classification with FedMD"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.23.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "scikit-learn>=1.3.0",  # For train_test_split if needed
    "requests>=2.28.0"      # For pushing metrics to backend API
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "shrenik"

[tool.flwr.app.components]
serverapp = "flex_med.server_app:app"
clientapp = "flex_med.client_app:app"

[tool.flwr.app.config]
# Training configuration (optimized for stability with round-based LR decay)
# SIMPLIFIED: Removed freeze/unfreeze, using simple fine-tuning with LR decay
num-server-rounds = 15           # 15 rounds with LR decay schedule
fraction-train = 1.0             # Use all clients each round
fraction-evaluate = 1.0          # Use all clients each round
local-epochs = 4                 # Reduced from 6 - simpler training without freeze/unfreeze
lr = 0.0001                      # Base LR (decays by round: 1x -> 0.5x -> 0.25x -> 0.1x)

# Distillation configuration
# Note: Epochs increase in later rounds (2 -> 3 -> 4) for stability
distill-lr = 0.001               # Distillation LR
distill-epochs = 2               # Base epochs (increases in later rounds via client_app.py)
temperature = 3.0                # Softer labels for better generalization

# Data configuration
batch-size = 32                  # Smaller batch size for better gradients on small datasets

[tool.flwr.federations]
default = "local-simulation"

# Local simulation (default 3 clients, but overridden dynamically by backend)
# Note: num-supernodes is set dynamically based on number of clients in database
[tool.flwr.federations.local-simulation]
options.num-supernodes = 2       # Default fallback value (overridden at runtime)

# Optional: Add more clients for scaling experiments
# [tool.flwr.federations.local-simulation-5clients]
# options.num-supernodes = 2

# Remote federation (for deployment)
[tool.flwr.federations.remote-federation]
address = "<SUPERLINK-ADDRESS>:<PORT>"
insecure = true
# root-certificates = "<PATH/TO/ca.crt>"  # For production TLS